<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard for browser extensions attempting to reassign window.fetch on Window object
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Intercept and prevent extension-origin fetch errors from breaking the page
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            typeof event.reason.message === 'string' &&
            event.reason.message.indexOf('Cannot set property fetch') !== -1
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>

    <div id="fb-root"></div>

    <script>
      window.fbAsyncInit = function() {
        if (window.FB) {
          window.FB.init({
            xfbml: true,
            version: 'v18.0'
          });
          window.FB.Event.subscribe('xfbml.ready', function(msg) {
            if (msg.type === 'video') {
              msg.instance.subscribe('finishedPlaying', function() {
                try {
                  msg.instance.seek(0);
                  msg.instance.pause();
                } catch(e) {}
              });
            }
          });
        }
      };
    </script>
